<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能预问诊</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f0f4f8; color: #1a2b3c; font-size: 18px; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 16px; min-height: 100vh;
          display: flex; flex-direction: column; }
  header { text-align: center; padding: 20px 0; }
  header h1 { font-size: 26px; color: #0b5fa5; }
  header p { color: #5a7a99; margin-top: 6px; font-size: 16px; }
  .card { background: #fff; border-radius: 14px; padding: 24px;
          box-shadow: 0 2px 10px rgba(11,95,165,.08); margin-bottom: 16px; }
  input[type=text] { width: 100%; padding: 14px; font-size: 20px; border: 2px solid #b8cee0;
                     border-radius: 10px; outline: none; }
  input[type=text]:focus { border-color: #0b5fa5; }
  .btn { display: block; width: 100%; padding: 16px; font-size: 20px; border: none;
         border-radius: 10px; background: #0b5fa5; color: #fff; cursor: pointer;
         margin-top: 14px; font-weight: 600; }
  .btn:disabled { background: #9db8cc; }
  .btn.warn { background: #c0392b; }
  /* 对话区 */
  #chat { flex: 1; display: none; flex-direction: column; }
  #msgs { flex: 1; overflow-y: auto; padding: 8px 0; }
  .msg { max-width: 85%; padding: 12px 16px; border-radius: 14px; margin: 8px 0;
         line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg.bot { background: #fff; align-self: flex-start; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .msg.user { background: #0b5fa5; color: #fff; align-self: flex-end; }
  .msg.sys { background: #fff3e0; color: #8a5a00; align-self: center; font-size: 16px;
             max-width: 100%; text-align: center; }
  .banner-alert { background: #fdecea; color: #c0392b; border: 2px solid #e74c3c;
                  border-radius: 12px; padding: 18px; text-align: center; font-weight: 600;
                  display: none; }
  .banner-done { background: #e8f6ee; color: #1e7d46; border: 2px solid #27ae60;
                 border-radius: 12px; padding: 18px; text-align: center; font-weight: 600; }
  .sid-tip { font-size: 14px; color: #5a7a99; text-align: center; margin-top: 10px;
             user-select: all; }
  #inputbar { display: none; padding: 12px 0; }
  #inputbar .row { display: flex; gap: 10px; }
  #inputbar textarea { flex: 1; padding: 14px; font-size: 19px; border: 2px solid #b8cee0;
                       border-radius: 10px; resize: none; height: 60px; outline: none; }
  #send { padding: 0 26px; font-size: 19px; background: #0b5fa5; color: #fff; border: none;
          border-radius: 10px; cursor: pointer; font-weight: 600; }
  #send:disabled { background: #9db8cc; }
  /* 同意页 */
  #consent .doc { background: #f8fafc; border: 1px solid #dbe7f0; border-radius: 10px;
                  padding: 18px; line-height: 1.8; font-size: 16px; color: #2c4a63; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>智能预问诊</h1>
    <p>您的症状将整理成病历草稿，供医生快速接诊</p>
  </header>

  <!-- 阶段1：绑定患者 -->
  <div id="bind" class="card">
    <label for="pid">请输入就诊卡号</label>
    <input type="text" id="pid" value="P001" placeholder="如 P001">
    <button class="btn" id="btnStart">开始问诊</button>
  </div>

  <!-- 阶段2：知情同意 -->
  <div id="consent" class="card hidden">
    <h3 style="margin-bottom:12px">知情同意书</h3>
    <div class="doc">
      1. 本系统为<b>预问诊辅助工具</b>，仅整理您的症状描述，不提供诊断与用药建议；<br>
      2. 所有内容由<b>执业医师复核确认</b>后才会进入病历；<br>
      3. 问诊过程与结果将被<b>加密记录</b>，用于医疗质控与审计；<br>
      4. 如出现紧急症状，系统将立即通知护士站优先处理。
    </div>
    <button class="btn" id="btnConsent">我已阅读并同意</button>
  </div>

  <!-- 阶段3：对话 -->
  <div id="chat">
    <div class="banner-alert" id="alertBanner">
      ⚠ 检测到紧急症状，已通知护士站！<br>请留在原地，医护人员马上到达。
    </div>
    <div id="msgs"></div>
    <div id="inputbar">
      <div class="row">
        <textarea id="txt" placeholder="请描述您的症状…"></textarea>
        <button id="send">发送</button>
      </div>
    </div>
    <div class="card hidden" id="doneCard">
      <div class="banner-done">
        ✓ 预问诊完成<br>病历草稿已推送至医生工作站，请在大厅等待叫号
      </div>
      <div class="sid-tip">问诊编号（医生端查询用）：<b id="sidShow"></b></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let sid = null, busy = false;

function addMsg(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  $('msgs').appendChild(d);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}

async function api(path, body, method) {
  const r = await fetch(path, {
    method: method || (body ? 'POST' : 'GET'),
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ('请求失败 ' + r.status));
  return data;
}

$('btnStart').onclick = async () => {
  try {
    const d = await api('/sessions', { patient_id: $('pid').value.trim() || 'P001' });
    sid = d.session_id;
    $('bind').classList.add('hidden');
    $('consent').classList.remove('hidden');
  } catch (e) { alert(e.message); }
};

$('btnConsent').onclick = async () => {
  try {
    const d = await api(`/sessions/${sid}/consent`, null, 'POST');
    $('consent').classList.add('hidden');
    $('chat').style.display = 'flex';
    $('inputbar').style.display = 'block';
    addMsg(d.reply, 'bot');
  } catch (e) { alert(e.message); }
};

async function send() {
  const text = $('txt').value.trim();
  if (!text || busy) return;
  busy = true; $('send').disabled = true; $('txt').value = '';
  addMsg(text, 'user');
  try {
    const d = await api(`/sessions/${sid}/messages`, { text });
    if (d.state === 'alert') {
      addMsg(d.reply, 'bot');
      $('alertBanner').style.display = 'block';
      $('inputbar').style.display = 'none';
    } else if (d.state === 'review') {
      addMsg(d.reply || '预问诊已完成，请等待叫号。', 'bot');
      $('inputbar').style.display = 'none';
      $('doneCard').classList.remove('hidden');
      $('sidShow').textContent = sid;
    } else {
      addMsg(d.reply, 'bot');
    }
  } catch (e) {
    addMsg(e.message, 'sys');
  } finally {
    busy = false; $('send').disabled = false;
  }
}
$('send').onclick = send;
$('txt').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
